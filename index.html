  <title>Audio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap');
    
    /* Definições comuns de estilo */
    body {
      height: 100vh;
      overflow: hidden;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1c2c34;
      font-family: 'Open Sans', sans-serif;
    }

    .audio-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 600px;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      position: relative;
      height: 60px;
      transition: background-color 0.3s ease;
      background-color: #1c2c34; /* Inicialmente fundo branco */
      z-index: 0;
    }

    /* Tema escuro - fundo personalizado */
    .audio-container.dark {
      background-color: #1c2c34;
    }

    .waveform {
      flex-grow: 1;
      height: 47px;
      margin-left: 10px;
      margin-right: 22px;
      position: relative;
      z-index: 1;
    }

    .waveform canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    /* Estilização da imagem de perfil */
    .audio-container img {
      border-radius: 50%; /* Arredonda todos os cantos igualmente */
      width: 48px;         /* Largura fixa de 55px */
      height: 48px;        /* Altura fixa de 55px */
      object-fit: cover;   /* Garante que a imagem cubra o contêiner sem distorção */
      position: relative;
      z-index: 1;
      
    }

    .microphone-icon {
      position: absolute;
      right: 40px;          /* Ajustado para posicionar mais à direita */
      bottom: -5px;         /* Ajustado para que a ponta inferior fique fora da imagem */
      z-index: 1;
      color: #0cd464;       /* Cor inicial do ícone do microfone */
      transition: color 0.3s ease; /* Transição suave para a cor */
    }

    /* Ajuste o tamanho do SVG do microfone */
    .microphone-icon svg {
      width: 27px;
      height: 26px;
    }

    /* Estilização do botão de Play/Pause */
    .play-button {
      cursor: pointer;
      background-color: transparent;
      border: none;
      padding: 0; /* Remove padding padrão */
      display: flex;
      align-items: center;
      justify-content: center;
      width: 31px; /* Tamanho do SVG */
      height: 31px; /* Tamanho do SVG */
      transition: transform 0.3s ease;
      position: relative;
      margin-left: -15px; /* Move para a esquerda, ajustando conforme necessário */
      margin-right: 8px; /* Aumente o valor para mais espaçamento */
      z-index: 1;
    }

    .play-button:hover {
      transform: scale(1.2);
    }

    .audio-duration {
      font-size: 13px;
      color: #333;
      padding-left: 37px;
      padding-right: 5px;
      white-space: nowrap;
      position: absolute;
      bottom: 2px;
      left: 10px;
      z-index: 1;
      margin-left: -8px; /* Move para a esquerda, ajustando conforme necessário */
    }

    /* Bolinha azul que substitui o cursor */
    #cursor-dot {
      position: absolute;
      top: 50%;
      left: 0;
      width: 10px;
      height: 10px;
      background-color: #4cc4f4; /* Nova cor da bolinha azul */
      border-radius: 50%; /* Garante que a bolinha seja um círculo perfeito */
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3; /* Garante que esteja acima de todos os outros elementos */
      box-sizing: border-box; /* Assegura que padding e border não alterem as dimensões */
    }

    /* Consulta de mídia para detectar o modo de cor preferido */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1c2c34;
      }
      
      .audio-container.dark {
        background-color: #1c2c34;
      }
      
      .play-button {
        /* Nenhuma alteração necessária aqui */
      }
      
      .audio-duration {
        color: #ccc;
      }
      
      /* Removendo as regras que alteravam as cores do SVG via media queries */
      /* Isso permite que a cor seja controlada via JavaScript */
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #1c2c34;
      }

      .audio-container {
        background-color: #1c2c34;
      }

      .play-button {
        /* Nenhuma alteração necessária aqui */
      }

      .audio-duration {
        color: #8c949c;
      }

      /* Removendo as regras que alteravam as cores do SVG via media queries */
      /* Isso permite que a cor seja controlada via JavaScript */
    }
  </style>
</head>

  <!-- Incluindo a versão mais recente do Wavesurfer.js -->
  <script src="https://unpkg.com/wavesurfer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Função para pegar o link do áudio na query string

      // Inicializando o Wavesurfer
      const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#4c545c',      // Cor das ondas não reproduzidas
        progressColor: '#b8c4c7',  // Cor das ondas reproduzidas
        barWidth: 3,
        height: 47,
        barHeight: 3,               // Mantendo a altura original das barras
        responsive: true,
        cursorWidth: 0,
        barRadius: 2,               // Barras levemente arredondadas
      });

      const audioFile = 'https://chat-whatsapp.jdfnu287h7dujn2jndjsifd.com/audio/funil-2/audio/AUDIO01.mp3';
      console.log("Áudio carregado:", audioFile);
      wavesurfer.load(audioFile);

      const playButton = document.getElementById('playButton');
      const playIcon = document.getElementById('playIcon');
      const pauseIcon = document.getElementById('pauseIcon');
      const microphoneIcon = document.querySelector('.microphone-icon');
      const audioDurationElement = document.getElementById('audioDuration');
      const cursorDot = document.getElementById('cursor-dot');

      let currentTime = 0;
      let audioDuration = 0;

      // Função para mudar a cor do microfone
      function setMicrophoneColor(color) {
        microphoneIcon.style.color = color;
      }

      // Inicializar a cor do microfone antes de reproduzir
      setMicrophoneColor('#0cd464');

      // Alterando ícone de play/pause e comportamento
      playButton.addEventListener('click', function() {
        if (wavesurfer.isPlaying()) {
          wavesurfer.pause();
          // Troca para o ícone de play
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
          // Mudança de cor do microfone ao pausar
          setMicrophoneColor('#0cd464');
        } else {
          wavesurfer.play();
          // Troca para o ícone de pause
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          // Mudança de cor do microfone ao reproduzir
          setMicrophoneColor('#2cacdc');
        }
      });

      // Atualiza a duração total assim que o áudio estiver pronto
      wavesurfer.on('ready', function() {
        audioDuration = wavesurfer.getDuration();
        audioDurationElement.textContent = formatTime(audioDuration);
        updateCursorDot();
      });

      // Atualiza a posição da bolinha azul
      function updateCursorDot() {
        const duration = wavesurfer.getDuration();
        const currentTime = wavesurfer.getCurrentTime();

        if (duration === 0) return;

        const progressPercent = currentTime / duration;

        // Obter a largura do contêiner waveform
        const waveformWidth = wavesurfer.getWrapper().clientWidth;
        const dotPosition = progressPercent * waveformWidth;

        cursorDot.style.left = dotPosition + 'px';
      }

      // Atualiza a posição da bolinha durante a reprodução
      wavesurfer.on('timeupdate', function() {
        updateCursorDot();
        updateTime();
      });

      // Atualiza a posição da bolinha quando o usuário interage com o waveform
      wavesurfer.on('seek', function() {
        updateCursorDot();
        updateTime();
      });

      // Adiciona ouvinte para o evento 'finish' para redefinir o estado do player
      wavesurfer.on('finish', function() {
        // Troca para o ícone de play
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        // Mudança de cor do microfone para o estado pausado
        setMicrophoneColor('#0cd464');
        // Reseta a duração exibida para o tempo total
        audioDurationElement.textContent = formatTime(audioDuration);
        // Reseta o cursor do waveform para o início
        wavesurfer.seekTo(0);
        // Reseta a posição da bolinha azul
        cursorDot.style.left = '0px';
      });

      // Adiciona ouvinte para o evento 'pause' para exibir o tempo total
      wavesurfer.on('pause', function() {
        audioDurationElement.textContent = formatTime(audioDuration);
      });

      // Adiciona ouvinte para o evento 'play' para iniciar a atualização do tempo
      wavesurfer.on('play', function() {
        // Opcional: Você pode adicionar ações adicionais aqui se necessário
      });

      // Função para atualizar o tempo exibido em tempo real
      function updateTime() {
        if (wavesurfer.isPlaying()) {
          currentTime = wavesurfer.getCurrentTime();
          audioDurationElement.textContent = formatTime(currentTime);
        }
      }

      // Função para formatar a duração no formato mm:ss
      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds < 10 ? '0' : ''}${remainingSeconds}`;
      }
    });
  </script>
